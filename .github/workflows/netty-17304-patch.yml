name: Netty 17304 patch validation

on:
  push:
    branches:
      - netty-17304-fix
    paths:
      - 'projects/netty-17304/**'
      - '.github/workflows/netty-17304-patch.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prove-baseline-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Clone pinned unmodified Netty 4.1
        run: |
          git clone --filter=blob:none https://github.com/netty/netty.git netty-baseline
          cd netty-baseline
          git checkout 1df2a41271401fd5107c0dfda96cac21c00f1278
          mkdir -p handler/src/test/java/io/netty/handler/ssl
          mkdir -p handler/src/test/java/io/netty/channel
          cp ../projects/netty-17304/upstream-test/io/netty/handler/ssl/SslHandlerBackpressureTest.java \
            handler/src/test/java/io/netty/handler/ssl/
          cp ../projects/netty-17304/upstream-test/io/netty/channel/SslTestPendingBytesAccess.java \
            handler/src/test/java/io/netty/channel/

      - name: Prove regression test fails without repair
        working-directory: netty-baseline
        shell: bash
        run: |
          set +e
          ./mvnw -B -ntp -pl handler -am \
            -Dtest=SslHandlerBackpressureTest \
            -Dsurefire.failIfNoSpecifiedTests=false \
            -Dcheckstyle.skip=true \
            test 2>&1 | tee ../baseline-test.log
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -eq 0 ]; then
            echo "ERROR: regression test unexpectedly passed on unmodified Netty"
            exit 1
          fi
          grep -F "a single flush must not convert the complete plaintext batch" ../baseline-test.log
          echo "Confirmed: unmodified Netty fails specifically at the TLS conversion burst assertion."

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: netty-17304-baseline-evidence
          path: baseline-test.log

  validate-upstream-patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Clone pinned Netty 4.1
        run: |
          git clone --filter=blob:none https://github.com/netty/netty.git netty-upstream
          cd netty-upstream
          git checkout 1df2a41271401fd5107c0dfda96cac21c00f1278

      - name: Apply complete SslHandler repair
        run: |
          python3 projects/netty-17304/apply_netty_patch.py \
            netty-upstream/handler/src/main/java/io/netty/handler/ssl/SslHandler.java
          python3 projects/netty-17304/apply_alert_compat_patch.py \
            netty-upstream/handler/src/main/java/io/netty/handler/ssl/SslHandler.java
          mkdir -p netty-upstream/handler/src/test/java/io/netty/handler/ssl
          mkdir -p netty-upstream/handler/src/test/java/io/netty/channel
          cp projects/netty-17304/upstream-test/io/netty/handler/ssl/SslHandlerBackpressureTest.java \
            netty-upstream/handler/src/test/java/io/netty/handler/ssl/
          cp projects/netty-17304/upstream-test/io/netty/channel/SslTestPendingBytesAccess.java \
            netty-upstream/handler/src/test/java/io/netty/channel/
          cd netty-upstream
          git diff --check
          git diff -- handler/src/main/java/io/netty/handler/ssl/SslHandler.java \
            handler/src/test/java/io/netty/handler/ssl/SslHandlerBackpressureTest.java \
            handler/src/test/java/io/netty/channel/SslTestPendingBytesAccess.java \
            > ../netty-17304-candidate.patch
          git status --short

      - name: Run focused Netty regression test
        working-directory: netty-upstream
        run: |
          ./mvnw -B -ntp -pl handler -am \
            -Dtest=SslHandlerBackpressureTest \
            -Dsurefire.failIfNoSpecifiedTests=false \
            -Dcheckstyle.skip=true \
            test

      - name: Run JDK compatibility sentinels
        working-directory: netty-upstream
        run: |
          ./mvnw -B -ntp -pl handler -am \
            '-Dtest=SslHandlerTest#testHandshakeFailureCipherMissmatchTLSv12Jdk+testHandshakeFailureCipherMissmatchTLSv13Jdk+testIncorrectLength' \
            -Dsurefire.failIfNoSpecifiedTests=false \
            -Dcheckstyle.skip=true \
            test

      - name: Run existing SslHandler regression suites
        id: ssl-suites
        working-directory: netty-upstream
        shell: bash
        run: |
          set +e
          ./mvnw -B -ntp -pl handler -am \
            -Dtest=SslHandlerTest,SslHandlerCoalescingBufferQueueTest,SslHandlerBackpressureTest \
            -Dsurefire.failIfNoSpecifiedTests=false \
            -Dcheckstyle.skip=true \
            -Dtcnative.artifactId=netty-tcnative-boringssl-static \
            -Dtcnative.classifier= \
            test 2>&1 | tee ../ssl-suite.log
          status=${PIPESTATUS[0]}
          set -e
          mkdir -p ../ssl-suite-reports
          find handler/target/surefire-reports -maxdepth 1 -type f -print -exec cp '{}' ../ssl-suite-reports/ \; 2>/dev/null || true
          echo "$status" > ../ssl-suite-status.txt
          exit "$status"

      - name: Show candidate patch
        if: always()
        run: cat netty-17304-candidate.patch || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: netty-17304-candidate-patch
          path: netty-17304-candidate.patch

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: netty-17304-ssl-suite-diagnostics
          path: |
            ssl-suite.log
            ssl-suite-status.txt
            ssl-suite-reports/
